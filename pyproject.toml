[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.1.0"
description = "Turn explicit intent and authority into verified software outcomes"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
factory = "software_factory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
